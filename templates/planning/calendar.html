{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h4>Cronograma semanal</h4><a href="{% url 'planning_create' %}" class="btn btn-primary">Novo planejamento</a></div><div id="calendar" class="mt-3"></div><script>document.addEventListener('DOMContentLoaded',()=>{const calEl=document.getElementById('calendar');const events=[{% for p in plans %}{title:'{{ p.contract.number }} - {{ p.service.name }}',start:'{{ p.planned_date|date:"Y-m-d" }}',color:'#0d6efd'},{% endfor %}];const c=new FullCalendar.Calendar(calEl,{initialView:'dayGridMonth',events});c.render();});</script>{% endblock %}
