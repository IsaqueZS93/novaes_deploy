{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h4>Receitas / faturamento</h4><a href="{% url 'finance_revenues_create' %}" class="btn btn-primary">Nova receita</a></div><table class="table"><tr><th>Data</th><th>Contrato</th><th>Status</th><th>Previsto</th><th>Recebido</th></tr>{% for r in rows %}<tr><td>{{ r.launch_date }}</td><td>{{ r.contract.number }}</td><td>{{ r.get_status_display }}</td><td>{{ r.expected_value }}</td><td>{{ r.received_value }}</td></tr>{% endfor %}</table>{% endblock %}
