{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h4>Clientes</h4><a href="{% url 'clients_create' %}" class="btn btn-primary">Novo cliente</a></div><form class="my-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Pesquisar cliente..."></form><table class="table table-striped"><tr><th>Razão social</th><th>CNPJ</th><th>Cidade</th><th></th></tr>{% for c in clients %}<tr><td>{{ c.corporate_name }}</td><td>{{ c.cnpj }}</td><td>{{ c.city }}</td><td><a href="{% url 'clients_edit' c.id %}">Editar</a></td></tr>{% endfor %}</table>{% endblock %}
