{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h4>Execução diária</h4><a href="{% url 'execution_create' %}" class="btn btn-primary">Novo lançamento</a></div><table class="table"><tr><th>Data</th><th>Contrato</th><th>Serviço</th><th>Equipe</th><th>Qtd.</th><th>Valor real</th></tr>{% for r in rows %}<tr><td>{{ r.execution_date }}</td><td>{{ r.contract.number }}</td><td>{{ r.service.name }}</td><td>{{ r.team }}</td><td>{{ r.executed_quantity }}</td><td>{{ r.actual_value }}</td></tr>{% endfor %}</table>{% endblock %}
