{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h4>Contratos</h4><a href="{% url 'contracts_create' %}" class="btn btn-primary">Novo contrato</a></div><table class="table"><tr><th>Número</th><th>Nome</th><th>Cliente</th><th>Status</th></tr>{% for c in contracts %}<tr><td><a href="{% url 'contracts_detail' c.id %}">{{ c.number }}</a></td><td>{{ c.name }}</td><td>{{ c.client }}</td><td>{{ c.get_status_display }}</td></tr>{% endfor %}</table>{% endblock %}
