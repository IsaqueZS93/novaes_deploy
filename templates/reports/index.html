{% extends 'base.html' %}{% block content %}<h4>Relatórios operacionais</h4><a href="{% url 'reports_print' %}" class="btn btn-outline-primary btn-sm mb-3">Impressão</a><table class="table"><tr><th>Data</th><th>Contrato</th><th>Serviço</th><th>Equipe</th><th>Qtd</th><th>Valor</th></tr>{% for r in rows %}<tr><td>{{ r.execution_date }}</td><td>{{ r.contract.number }}</td><td>{{ r.service.name }}</td><td>{{ r.team }}</td><td>{{ r.executed_quantity }}</td><td>{{ r.actual_value }}</td></tr>{% endfor %}</table>{% endblock %}
